</style></head><body><header><h1>Yurt Personeli Toplantı ve Görev Takip Sistemi</h1><p>Birlikte daha iyi hizmet için...</p></header><main><section id="auth" class="card"><h2>Personel Girişi</h2><input id="email" type="email" placeholder="E-posta"><input id="password" type="password" placeholder="Şifre"><button id="login">Giriş yap</button> <button id="signup" class="light">Hesap oluştur</button></section><section id="app" class="hide"><div id="installCard" class="card install-card hide"><b>📲 Yurt Takip’i telefonuna yükle</b><p class="small" id="installHint">Uygulamayı ana ekranına ekleyerek tam ekran kullanabilirsin.</p><button id="installApp" class="light">Uygulamayı yükle</button><button id="dismissInstall" class="light" aria-label="Yükleme önerisini kapat">Daha sonra</button></div><div class="card"><span id="who"></span><button id="logout" class="light" style="float:right">Çıkış</button></div><div id="screen"></div></section></main><nav id="nav" class="hide"><button data-page="home">⌂ Ana Sayfa</button><button data-page="agenda">♧ Gündem</button><button data-page="tasks">☑ İşlerim</button><button data-page="manager">⚙ Yönetim</button></nav><div id="print"></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://zuqrjysgejsqpdthzrbx.supabase.co','sb_publishable_InOxhnBzU_7n317O7gl6Xg_welATY0b');const $=id=>document.getElementById(id);let user=null,profile={},agenda=[],reports=[],tasks=[],people=[],meetings=[],decisions=[],meetingAgenda=[],notes=[],page='home',selectedMeeting='';const MAIN_AGENDA=["Mevcut Talebe Takibi","Talebe Temini","Nehari Talebe Hizmetleri","Personel Keyfiyeti","Mali Hizmetler","İrşadi Hizmetler","Resmî İşler","Hatırlatılacak Hususlar"];const agendaCategory=a=>MAIN_AGENDA.includes(a.category)?a.category:MAIN_AGENDA[7];const subNum=a=>{const list=agenda.filter(x=>agendaCategory(x)===agendaCategory(a)).slice().sort((x,y)=>new Date(x.created_at)-new Date(y.created_at));return (MAIN_AGENDA.indexOf(agendaCategory(a))+1)+'.'+(list.findIndex(x=>x.id===a.id)+1)};const groupedAgenda=()=>MAIN_AGENDA.map((name,i)=>'<div class="agenda-group"><h3>'+(i+1)+'. '+esc(name)+'</h3>'+agenda.filter(a=>agendaCategory(a)===name).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).map(a=>'<div class="entry" data-title="'+esc(a.title.toLocaleLowerCase('tr'))+'"><b>'+subNum(a)+' '+esc(a.title)+'</b><span class="small">'+esc(a.status)+'</span><p><button class="light" data-support="'+a.id+'">Ben de katılıyorum</button></p></div>').join('')+'</div>').join('');const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const card=(title,x)=>'<div class="card"><h2>'+title+'</h2>'+x+'</div>';async function init(){const r=await db.auth.getUser();user=r.data.user;$('auth').classList.toggle('hide',!!user);$('app').classList.toggle('hide',!user);$('nav').classList.toggle('hide',!user);if(!user)return;let p=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();if(!p.data){await db.from('profiles').insert({id:user.id,full_name:user.email.split('@')[0]});p=await db.from('profiles').select('*').eq('id',user.id).maybeSingle()}profile=p.data||{role:'staff'};$('who').textContent=(profile.full_name||user.email)+' · '+(profile.role==='manager'?'Yönetici':'Personel');await refresh();showInstall()}async function refresh(){const q=await Promise.all([db.from('agenda_items').select('*').order('created_at',{ascending:false}),db.from('reports').select('*').order('created_at',{ascending:false}),db.from('tasks').select('*'),db.from('profiles').select('id,full_name,role'),db.from('meetings').select('*').order('starts_at',{ascending:false}),db.from('decisions').select('*'),db.from('meeting_agenda').select('*'),db.from('meeting_notes').select('*')]);[agenda,reports,tasks,people,meetings,decisions,meetingAgenda,notes]=q.map(x=>x.data||[]);const err=q.find(x=>x.error);if(err)alert(err.error.message);render()}async function add(table,obj){const r=await db.from(table).insert(obj);if(r.error)alert(r.error.message);else{alert('Kaydedildi');await refresh()}}async function update(table,id,obj){const r=await db.from(table).update(obj).eq('id',id).select('id');if(r.error)alert(r.error.message);else if(!r.data?.length)alert('Yetki hatası');else refresh()}function executionOverview(){const now=Date.now(),week=7*86400000;const recent=tasks.filter(t=>{const d=decisions.find(x=>x.id===t.decision_id);return d&&now-new Date(d.created_at).getTime()<=week});const done=recent.filter(t=>['completed','verified'].includes(t.status)).length;const late=recent.filter(t=>t.due_date&&new Date(t.due_date+'T23:59:59').getTime()<now&&!['completed','verified'].includes(t.status)).length;return '<div class="tiles"><div class="tile green">'+done+' / '+recent.length+'<small>Tamamlanan</small></div><div class="tile pink">'+late+'<small>Geciken</small></div></div><p class="small">Son 7 günde oluşturulmuş kararlara bağlı görevler; oran '+(recent.length?Math.round(100*done/recent.length):0)+'% (görev olmadığı durumda 0).</p>'+recent.map(t=>'<div class="entry">'+esc(t.title)+' · '+esc(t.status)+'</div>').join('')}
function meetingWorkspace(){const m=meetings.find(x=>x.id===selectedMeeting);if(!m)return '<p class="small">Bir toplantı seçerek gündem ve karar girişini açın.</p>';const linked=meetingAgenda.filter(a=>a.meeting_id===m.id).map(x=>agenda.find(a=>a.id===x.agenda_id)).filter(Boolean);return '<p><b>'+esc(m.title)+'</b> · '+esc(m.status)+'</p><div class="entry"><b>Gündeme madde ekle</b><select id="addAgendaSelect"><option value="">Onaylı madde seçiniz</option>'+agenda.filter(a=>a.status==='approved'&&!linked.some(x=>x.id===a.id)).map(a=>'<option value="'+a.id+'">'+subNum(a)+' '+esc(a.title)+'</option>').join('')+'</select><button id="linkAgenda">Toplantıya ekle</button></div><div class="entry"><b>Görüşülecek maddeler</b>'+linked.map((a,i)=>'<p>'+subNum(a)+' '+esc(a.title)+'</p>').join('')+'</div><div class="entry"><label>İstişare maddesi</label><select id="topicChoice"><option value="">Genel not / karar</option>'+linked.map(a=>'<option value="'+a.id+'">'+esc(a.title)+'</option>').join('')+'</select><textarea id="meetingNote" placeholder="İstişare notu"></textarea><button id="saveNote" class="light">İstişare notunu kaydet</button></div><div class="entry"><textarea id="decisionText" placeholder="Alınan karar"></textarea><label>Sorumlu</label><select id="decisionStaff"><option value="">Görev oluşturma (opsiyonel)</option>'+people.map(p=>'<option value="'+p.id+'">'+esc(p.full_name||'Personel')+'</option>').join('')+'</select><label>Takip tarihi</label><input type="date" id="decisionDue"><button id="saveDecision">Kararı kaydet ve görev oluştur</button></div><div class="entry"><button class="light" id="finishMeeting">Toplantıyı bitir</button></div><p class="small">Bu toplantıya ait '+decisions.filter(d=>d.meeting_id===m.id).length+' karar, '+notes.filter(n=>n.meeting_id===m.id).length+' istişare notu bulunuyor.</p>'}
function render(){let v='';if(page==='home')v=card('Hızlı işlemler','<div class="tiles"><button class="tile blue" data-go="agenda"><span>🗓</span>Toplantı Gündemi</button><button class="tile pink" data-go="problem"><span>⚠</span>Sorun Bildir</button><button class="tile green" data-go="request"><span>📦</span>İhtiyaç / Talep</button><button class="tile orange" data-go="tasks"><span>✓</span>İşlerim</button></div>');if(page==='problem'||page==='request')v=card(page==='problem'?'Sorun Bildir':'İhtiyaç / Talep','<input id="title" maxlength="300" placeholder="Kısa açıklama"><textarea id="detail" placeholder="Ek açıklama (isteğe bağlı)"></textarea>'+(page==='problem'?'<label><input type="checkbox" id="urgent" style="width:auto"> Acil müdahale gerekiyor</label><p class="small">Acil durumlarda ayrıca mevcut acil hattı kullanın.</p>':'')+'<p><button id="send">Gönder</button></p>');if(page==='agenda')v=card('Ortak Toplantı Gündemi','<input id="filter" placeholder="Benzer konuyu ara">'+groupedAgenda())+card('Gündem alt maddesi önerisi','<label>Önce ana gündem başlığını seçin</label><select id="agendaCategory">'+MAIN_AGENDA.map((x,i)=>'<option value="'+esc(x)+'">'+(i+1)+'. '+esc(x)+'</option>').join('')+'</select><input id="topic" maxlength="300" placeholder="Gündem maddesi"><button id="addTopic">Gündeme öner</button>');if(page==='tasks')v=card('İşlerim',tasks.map(t=>'<div class="entry"><b>'+esc(t.title)+'</b><span class="small">'+esc(t.status)+'</span><p><button data-task="'+t.id+'" data-status="completed">Tamamladım</button> <button class="light" data-task="'+t.id+'" data-status="blocked">Destek gerekiyor</button></p></div>').join('')||'Henüz görev yok')+card('Bildirdiklerim',reports.filter(r=>r.created_by===user.id).map(r=>'<p>'+esc(r.title)+' · '+esc(r.status)+'</p>').join(''));if(page==='manager')v=profile.role==='manager'
