</style></head><body><header><h1>Yurt Personeli Toplantı ve Görev Takip Sistemi</h1><p>Birlikte daha iyi hizmet için...</p></header><main><section id="auth" class="card"><h2>Personel Girişi</h2><input id="email" type="email" placeholder="E-posta"><input id="password" type="password" placeholder="Şifre"><button id="login">Giriş yap</button> <button id="signup" class="light">Hesap oluştur</button></section><section id="app" class="hide"><div id="installCard" class="card install-card hide"><b>📲 Yurt Takip’i telefonuna yükle</b><p class="small" id="installHint">Uygulamayı ana ekranına ekleyerek tam ekran kullanabilirsin.</p><button id="installApp" class="light">Uygulamayı yükle</button><button id="dismissInstall" class="light" aria-label="Yükleme önerisini kapat">Daha sonra</button></div><div class="card"><span id="who"></span><button id="openNotifications" class="light" type="button">🔔 <span id="unreadCount">0</span></button><button id="openProfile" class="light" type="button">◉ Profil</button><button id="checkUpdates" class="light" style="font-size:11px">↻ Güncelle</button><button id="logout" class="light" style="float:right">Çıkış</button></div><div id="screen"></div></section></main><nav id="nav" class="hide"><button data-page="home">⌂ Ana Sayfa</button><button data-page="agenda">♧ Gündem</button><button data-page="tasks">☑ İşlerim</button><button data-page="manager">⚙ Yönetim</button></nav><div id="print"></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const APP_VERSION='2026.11.01.17';const db=createClient('https://zuqrjysgejsqpdthzrbx.supabase.co','sb_publishable_InOxhnBzU_7n317O7gl6Xg_welATY0b');const $=id=>document.getElementById(id);let user=null,profile={},agenda=[],reports=[],tasks=[],people=[],meetings=[],decisions=[],meetingAgenda=[],notes=[],notifications=[],contacts=[],page='home',selectedMeeting='',managerSection='users';const MAIN_AGENDA=["Mevcut Talebe Takibi","Talebe Temini","Nehari Tale
