<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d5ecff"><title>Yurt Personeli Takip</title><style>*{box-sizing:border-box}body{margin:0;background:#edf7ff;color:#113866;font:15px system-ui}header{background:linear-gradient(100deg,#cce7fc,#fff,#cce7fc);text-align:center;padding:25px 12px;border-bottom:2px solid #bad9ef}h1{font-size:23px;margin:0}header p{color:#607f9b}main{max-width:850px;margin:auto;padding:15px 15px 90px}.card{background:white;border:1px solid #c5dfef;padding:17px;border-radius:20px;margin:12px 0;box-shadow:0 7px 23px #2c6fa617}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{min-height:125px;color:#123b63;display:grid;place-content:center;font-size:16px}.tile span{font-size:30px;display:block}.blue{background:#c9e6ff}.pink{background:#f9dae3}.green{background:#ccefdc}.orange{background:#ffe2b3}button{border:0;border-radius:13px;padding:12px;background:#147bce;color:white;font-weight:700;cursor:pointer}button.light{background:#e8f1fc;color:#24628f}input,textarea{width:100%;padding:12px;border:1px solid #c3d6eb;border-radius:12px;margin:7px 0}textarea{min-height:70px}.entry{border-bottom:1px solid #e2eef8;padding:12px 0}.entry b{display:block}.small{color:#69819a;font-size:12px}.hide{display:none!important}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:white;padding:7px;border-top:1px solid #d0e6f5}nav button{background:transparent;color:#28679b;font-size:12px}@media(min-width:750px){.tiles{grid-template-columns:repeat(4,1fr)}nav{max-width:850px;margin:auto}}@media print{header,main,nav{display:none!important}#print{display:block!important}#print .line{height:32px;border-bottom:1px solid #bbb}}#print{display:none}</style></head><body><header><h1>Yurt Personeli Toplantı ve Görev Takip Sistemi</h1><p>Birlikte daha iyi hizmet için...</p></header><main><section id="auth" class="card"><h2>Personel Girişi</h2><input id="email" type="email" placeholder="E-posta"><input id="password" type="password" placeholder="Şifre"><button id="login">Giriş yap</button> <button id="signup" class="light">Hesap oluştur</button></section><section id="app" class="hide"><div class="card"><span id="who"></span><button id="logout" class="light" style="float:right">Çıkış</button></div><div id="screen"></div></section></main><nav id="nav" class="hide"><button data-page="home">⌂ Ana sayfa</button><button data-page="agenda">♧ Gündem</button><button data-page="tasks">☑ İşlerim</button><button data-page="manager">⚙ Yönetim</button></nav><div id="print"></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://zuqrjysgejsqpdthzrbx.supabase.co','sb_publishable_InOxhnBzU_7n317O7gl6Xg_welATY0b');const $=id=>document.getElementById(id);let user=null,profile={},agenda=[],reports=[],tasks=[],page='home';const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const card=(title,x)=>'<div class="card"><h2>'+title+'</h2>'+x+'</div>';async function init(){const r=await db.auth.getUser();user=r.data.user;$('auth').classList.toggle('hide',!!user);$('app').classList.toggle('hide',!user);$('nav').classList.toggle('hide',!user);if(!user)return;let p=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();if(!p.data){await db.from('profiles').insert({id:user.id,full_name:user.email.split('@')[0]});p=await db.from('profiles').select('*').eq('id',user.id).maybeSingle()}profile=p.data||{role:'staff'};$('who').textContent=(profile.full_name||user.email)+' · '+(profile.role==='manager'?'Yönetici':'Personel');await refresh()}async function refresh(){const q=await Promise.all([db.from('agenda_items').select('*').order('created_at',{ascending:false}),db.from('reports').select('*').order('created_at',{ascending:false}),db.from('tasks').select('*')]);[agenda,reports,tasks]=q.map(x=>x.data||[]);const err=q.find(x=>x.error);if(err)alert(err.error.message);render()}async function add(table,obj){const r=await db.from(table).insert(obj);if(r.error)alert(r.error.message);else{alert('Kaydedildi');await refresh()}}async function update(table,id,obj){const r=await db.from(table).update(obj).eq('id',id).select('id');if(r.error)alert(r.error.message);else if(!r.data?.length)alert('Yetki hatası');else refresh()}function render(){let v='';if(page==='home')v=card('Hızlı işlemler','<div class="tiles"><button class="tile blue" data-go="agenda"><span>♧</span>Toplantı Gündemi</button><button class="tile pink" data-go="problem"><span>📣</span>Sorun Bildir</button><button class="tile green" data-go="request"><span>▤</span>İhtiyaç / Talep</button><button class="tile orange" data-go="tasks"><span>☑</span>İşlerim</button></div>');if(page==='problem'||page==='request')v=card(page==='problem'?'Sorun Bildir':'İhtiyaç / Talep','<input id="title" maxlength="300" placeholder="Kısa açıklama"><textarea id="detail" placeholder="Ek açıklama (isteğe bağlı)"></textarea>'+(page==='problem'?'<label><input type="checkbox" id="urgent" style="width:auto"> Acil müdahale gerekiyor</label><p class="small">Acil durumlarda ayrıca mevcut acil hattı kullanın.</p>':'')+'<p><button id="send">Gönder</button></p>');if(page==='agenda')v=card('Ortak Toplantı Gündemi','<input id="filter" placeholder="Benzer konuyu ara">'+agenda.map(a=>'<div class="entry" data-title="'+esc(a.title.toLocaleLowerCase('tr'))+'"><b>'+esc(a.title)+'</b><span class="small">'+esc(a.status)+'</span><p><button class="light" data-support="'+a.id+'">Ben de katılıyorum</button></p></div>').join(''))+card('Gündem önerisi','<input id="topic" maxlength="300" placeholder="Gündem maddesi"><button id="addTopic">Gündeme öner</button>');if(page==='tasks')v=card('İşlerim',tasks.map(t=>'<div class="entry"><b>'+esc(t.title)+'</b><span class="small">'+esc(t.status)+'</span><p><button data-task="'+t.id+'" data-status="completed">Tamamladım</button> <button class="light" data-task="'+t.id+'" data-status="blocked">Destek gerekiyor</button></p></div>').join('')||'Henüz görev yok')+card('Bildirdiklerim',reports.filter(r=>r.created_by===user.id).map(r=>'<p>'+esc(r.title)+' · '+esc(r.status)+'</p>').join(''));if(page==='manager')v=profile.role==='manager'?card('Yönlendirilecekler',reports.map(r=>'<div class="entry"><b>'+esc(r.title)+'</b><span class="small">'+esc(r.status)+'</span><p><button data-assign="'+r.id+'">Görev ata</button> <button class="light" data-meeting="'+r.id+'">Toplantıya aktar</button></p></div>').join('')||'Bildirim yok')+card('Toplantı Gündemi / PDF','<button id="printAgenda">Gündemi PDF / Yazdır</button>'+agenda.filter(a=>a.status==='proposed').map(a=>'<p>'+esc(a.title)+' <button data-approve="'+a.id+'">Onayla</button></p>').join('')):card('Yönetim','Yalnızca yöneticiler erişebilir.');$('screen').innerHTML=v;document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});if($('send'))$('send').onclick=()=>{const t=$('title').value.trim();if(t.length<3)return alert('Başlık girin');add('reports',{kind:page==='problem'?'problem':'request',title:t,details:$('detail').value,urgency:$('urgent')?.checked?'urgent':'normal',created_by:user.id})};if($('addTopic'))$('addTopic').onclick=()=>{const t=$('topic').value.trim();if(t.length<3)return alert('Başlık gerekli');if(agenda.some(a=>a.title.toLocaleLowerCase('tr')===t.toLocaleLowerCase('tr')))return alert('Aynı madde mevcut');add('agenda_items',{title:t,created_by:user.id})};if($('filter'))$('filter').oninput=e=>document.querySelectorAll('[data-title]').forEach(d=>d.style.display=d.dataset.title.includes(e.target.value.toLocaleLowerCase('tr'))?'':'none');document.querySelectorAll('[data-support]').forEach(b=>b.onclick=async()=>{let r=await db.from('agenda_supports').insert({agenda_id:b.dataset.support,user_id:user.id});alert(r.error?'Bu maddeye daha önce katılmış olabilirsiniz':'Katılım kaydedildi')});document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>update('tasks',b.dataset.task,{status:b.dataset.status}));document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>update('agenda_items',b.dataset.approve,{status:'approved'}));document.querySelectorAll('[data-meeting]').forEach(b=>b.onclick=async()=>{const r=reports.find(x=>x.id===b.dataset.meeting);const a=await db.from('agenda_items').insert({title:r.title,details:r.details,created_by:user.id});if(a.error)return alert(a.error.message);update('reports',r.id,{status:'agenda'})});document.querySelectorAll('[data-assign]').forEach(b=>b.onclick=async()=>{const name=prompt('Sorumlu personelin profil adı:');if(!name)return;const p=await db.from('profiles').select('id').eq('full_name',name).maybeSingle();if(!p.data)return alert('Kişi bulunamadı');const r=reports.find(x=>x.id===b.dataset.assign);const t=await db.from('tasks').insert({title:r.title,details:r.details,assigned_to:p.data.id,report_id:r.id,created_by:user.id});if(t.error)return alert(t.error.message);update('reports',r.id,{status:'assigned'})});if($('printAgenda'))$('printAgenda').onclick=()=>{$('print').innerHTML='<h1>TOPLANTI GÜNDEM MADDELERİ</h1><p>Tarih: ........... Personel: ................</p>'+agenda.filter(a=>a.status==='approved').map((a,i)=>'<section><b>'+(i+1)+'. '+esc(a.title)+'</b><div class="line"></div><div class="line"></div></section>').join('');window.print()}}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$('login').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return alert('E-posta adresinizi ve şifrenizi girin.');const r=await db.auth.signInWithPassword({email,password});if(r.error)alert(r.error.message);else init()};$('signup').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return alert('Geçerli bir e-posta adresi girin.');if(password.length<8)return alert('Şifreniz en az 8 karakter olmalıdır.');const r=await db.auth.signUp({email,password,options:{emailRedirectTo:'https://eryigityusuf.github.io/yurt-personel-takip/'}});if(r.error)return alert('Hesap oluşturulamadı: '+r.error.message);alert(r.data.session?'Hesabınız oluşturuldu ve giriş yapıldı.':'Hesabınız oluşturuldu. E-posta adresinize gelen doğrulama bağlantısını açın.');if(r.data.session)await init()};$('logout').onclick=async()=>{await db.auth.signOut();user=null;init()};init();</script></body></html>
