<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d5ecff"><title>Yurt Personeli Takip</title><style>
:root{--navy:#092f62;--sky:#c5e5fb;--light:#eff8ff;--pink:#f9d7e3;--mint:#c9efdc;--peach:#ffe3b4;--line:#c3dff1}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,#dceeff 0%,#f4faff 55%,#eaf5ff 100%);color:var(--navy);font:15px system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100dvh}
header{background:linear-gradient(115deg,#b9ddf7 0%,#e7f5ff 48%,#c9e8fa 100%);text-align:center;padding:29px 19px 30px;border-bottom:2px solid #a9cee7;position:relative}
header:before{content:"⌂";position:absolute;left:18px;top:13px;color:#5289b4;font-size:32px;opacity:.5}
h1{font-size:clamp(23px,5vw,32px);line-height:1.2;margin:0;color:var(--navy);letter-spacing:-.6px}
header p{color:#416c91;font-weight:600;margin:9px 0 0}
main{max-width:900px;margin:auto;padding:15px 14px 108px}
.card{background:#ffffffed;border:1px solid #bfddf0;padding:19px;border-radius:23px;margin:14px 0;box-shadow:0 12px 30px #24699e14}
.card h2{color:var(--navy);font-size:19px;margin:0 0 17px;letter-spacing:-.3px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.tile{min-height:145px;color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:16px;line-height:1.25;border:1px solid #ffffffd9!important;border-radius:20px!important;box-shadow:0 5px 12px #20578910}
.tile span{font-size:33px;display:block}
.blue{background:#c9e8ff!important}.pink{background:#f8d5e1!important}.green{background:#c8efd9!important}.orange{background:#ffe2ad!important}
button{border:0;border-radius:14px;padding:13px 15px;background:#1576bd;color:white;font-weight:700;cursor:pointer;min-height:44px}
button.light{background:#e6f2fd;color:#155b90;border:1px solid #d2e5f4}
button:active{transform:scale(.985)}
input,textarea,select{width:100%;padding:14px;border:1px solid #bbd9ed;border-radius:13px;margin:8px 0;color:#163a60;background:#fafdff;font-size:16px}
input:focus,textarea:focus{outline:2px solid #83bbe8;outline-offset:1px}
textarea{min-height:90px}
.entry{border-bottom:1px solid #ddebf5;padding:15px 0}
.entry b{display:block;font-size:15px}
.small{color:#547894;font-size:13px}
.hide{display:none!important}
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:#f9fdffed;backdrop-filter:blur(16px);padding:8px 5px max(9px,env(safe-area-inset-bottom));border-top:1px solid #bfdbed;box-shadow:0 -5px 22px #0d4c7915;z-index:10}
nav button{background:transparent;color:#315f83;font-size:12px;padding:9px 2px;border-radius:12px;font-weight:700}
nav button:active{background:#e1f2ff}
#auth{max-width:470px;margin:18px auto}
#auth button{margin:4px}
@media(min-width:750px){.tiles{grid-template-columns:repeat(4,1fr)}.tile{min-height:166px}nav{max-width:900px;margin:auto;border-radius:20px 20px 0 0}main{padding:23px 22px 110px}}
@media print{header,main,nav{display:none!important}#print{display:block!important}#print .line{height:32px;border-bottom:1px solid #bbb}}
#print{display:none}
</style></head><body><header><h1>Yurt Personeli Toplantı ve Görev Takip Sistemi</h1><p>Birlikte daha iyi hizmet için...</p></header><main><section id="auth" class="card"><h2>Personel Girişi</h2><input id="email" type="email" placeholder="E-posta"><input id="password" type="password" placeholder="Şifre"><button id="login">Giriş yap</button> <button id="signup" class="light">Hesap oluştur</button></section><section id="app" class="hide"><div class="card"><span id="who"></span><button id="logout" class="light" style="float:right">Çıkış</button></div><div id="screen"></div></section></main><nav id="nav" class="hide"><button data-page="home">⌂ Ana sayfa</button><button data-page="agenda">♧ Gündem</button><button data-page="tasks">☑ İşlerim</button><button data-page="manager">⚙ Yönetim</button></nav><div id="print"></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://zuqrjysgejsqpdthzrbx.supabase.co','sb_publishable_InOxhnBzU_7n317O7gl6Xg_welATY0b');const $=id=>document.getElementById(id);let user=null,profile={},agenda=[],reports=[],tasks=[],people=[],page='home';const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const card=(title,x)=>'<div class="card"><h2>'+title+'</h2>'+x+'</div>';async function init(){const r=await db.auth.getUser();user=r.data.user;$('auth').classList.toggle('hide',!!user);$('app').classList.toggle('hide',!user);$('nav').classList.toggle('hide',!user);if(!user)return;let p=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();if(!p.data){await db.from('profiles').insert({id:user.id,full_name:user.email.split('@')[0]});p=await db.from('profiles').select('*').eq('id',user.id).maybeSingle()}profile=p.data||{role:'staff'};$('who').textContent=(profile.full_name||user.email)+' · '+(profile.role==='manager'?'Yönetici':'Personel');await refresh()}async function refresh(){const q=await Promise.all([db.from('agenda_items').select('*').order('created_at',{ascending:false}),db.from('reports').select('*').order('created_at',{ascending:false}),db.from('tasks').select('*'),db.from('profiles').select('id,full_name,role')]);[agenda,reports,tasks,people]=q.map(x=>x.data||[]);const err=q.find(x=>x.error);if(err)alert(err.error.message);render()}async function add(table,obj){const r=await db.from(table).insert(obj);if(r.error)alert(r.error.message);else{alert('Kaydedildi');await refresh()}}async function update(table,id,obj){const r=await db.from(table).update(obj).eq('id',id).select('id');if(r.error)alert(r.error.message);else if(!r.data?.length)alert('Yetki hatası');else refresh()}function render(){let v='';if(page==='home')v=card('Hızlı işlemler','<div class="tiles"><button class="tile blue" data-go="agenda"><span>♧</span>Toplantı Gündemi</button><button class="tile pink" data-go="problem"><span>📣</span>Sorun Bildir</button><button class="tile green" data-go="request"><span>▤</span>İhtiyaç / Talep</button><button class="tile orange" data-go="tasks"><span>☑</span>İşlerim</button></div>');if(page==='problem'||page==='request')v=card(page==='problem'?'Sorun Bildir':'İhtiyaç / Talep','<input id="title" maxlength="300" placeholder="Kısa açıklama"><textarea id="detail" placeholder="Ek açıklama (isteğe bağlı)"></textarea>'+(page==='problem'?'<label><input type="checkbox" id="urgent" style="width:auto"> Acil müdahale gerekiyor</label><p class="small">Acil durumlarda ayrıca mevcut acil hattı kullanın.</p>':'')+'<p><button id="send">Gönder</button></p>');if(page==='agenda')v=card('Ortak Toplantı Gündemi','<input id="filter" placeholder="Benzer konuyu ara">'+agenda.map(a=>'<div class="entry" data-title="'+esc(a.title.toLocaleLowerCase('tr'))+'"><b>'+esc(a.title)+'</b><span class="small">'+esc(a.status)+'</span><p><button class="light" data-support="'+a.id+'">Ben de katılıyorum</button></p></div>').join(''))+card('Gündem önerisi','<input id="topic" maxlength="300" placeholder="Gündem maddesi"><button id="addTopic">Gündeme öner</button>');if(page==='tasks')v=card('İşlerim',tasks.map(t=>'<div class="entry"><b>'+esc(t.title)+'</b><span class="small">'+esc(t.status)+'</span><p><button data-task="'+t.id+'" data-status="completed">Tamamladım</button> <button class="light" data-task="'+t.id+'" data-status="blocked">Destek gerekiyor</button></p></div>').join('')||'Henüz görev yok')+card('Bildirdiklerim',reports.filter(r=>r.created_by===user.id).map(r=>'<p>'+esc(r.title)+' · '+esc(r.status)+'</p>').join(''));if(page==='manager')v=profile.role==='manager'
?card('Personel Yönetimi','<p class="small">Yeni personel kayıt sayfasından kendi e-postasıyla hesap oluşturur. Kayıt sonrasında burada görünür.</p><button id="shareInvite">Kayıt bağlantısını paylaş / kopyala</button>'+people.map(p=>'<div class="entry"><b>'+esc(p.full_name||'Personel')+'</b><span class="small">'+(p.role==='manager'?'Yönetici':'Personel')+'</span></div>').join(''))
+card('Gelen Bildirimler',reports.map(r=>'<div class="entry"><b>'+esc(r.title)+'</b><span class="small">'+esc(r.status)+(r.urgency==='urgent'?' · 🔴 Acil':'')+'</span><p><button data-assign="'+r.id+'">Görev ata</button> <button class="light" data-meeting="'+r.id+'">Toplantıya aktar</button></p></div>').join('')||'Bildirim yok')
+card('Toplantı Gündemi / PDF','<button id="printAgenda">Gündemi PDF / Yazdır</button>'+agenda.filter(a=>a.status==='proposed').map(a=>'<p>'+esc(a.title)+' <button data-approve="'+a.id+'">Onayla</button></p>').join(''))
:card('Yönetim','Yalnızca yöneticiler erişebilir.');$('screen').innerHTML=v;document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});if($('send'))$('send').onclick=()=>{const t=$('title').value.trim();if(t.length<3)return alert('Başlık girin');add('reports',{kind:page==='problem'?'problem':'request',title:t,details:$('detail').value,urgency:$('urgent')?.checked?'urgent':'normal',created_by:user.id})};if($('addTopic'))$('addTopic').onclick=()=>{const t=$('topic').value.trim();if(t.length<3)return alert('Başlık gerekli');if(agenda.some(a=>a.title.toLocaleLowerCase('tr')===t.toLocaleLowerCase('tr')))return alert('Aynı madde mevcut');add('agenda_items',{title:t,created_by:user.id})};if($('filter'))$('filter').oninput=e=>document.querySelectorAll('[data-title]').forEach(d=>d.style.display=d.dataset.title.includes(e.target.value.toLocaleLowerCase('tr'))?'':'none');document.querySelectorAll('[data-support]').forEach(b=>b.onclick=async()=>{let r=await db.from('agenda_supports').insert({agenda_id:b.dataset.support,user_id:user.id});alert(r.error?'Bu maddeye daha önce katılmış olabilirsiniz':'Katılım kaydedildi')});document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>update('tasks',b.dataset.task,{status:b.dataset.status}));document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>update('agenda_items',b.dataset.approve,{status:'approved'}));document.querySelectorAll('[data-meeting]').forEach(b=>b.onclick=async()=>{const r=reports.find(x=>x.id===b.dataset.meeting);const a=await db.from('agenda_items').insert({title:r.title,details:r.details,created_by:user.id});if(a.error)return alert(a.error.message);update('reports',r.id,{status:'agenda'})});document.querySelectorAll('[data-assign]').forEach(b=>b.onclick=async()=>{const staff=people.filter(p=>p.role==='staff');if(!staff.length)return alert('Henüz personel hesabı yok. Personel Yönetimi bölümünden kayıt bağlantısını paylaşın.');const names=staff.map((p,i)=>(i+1)+'. '+(p.full_name||'Personel')).join('\n');const choice=prompt('Görevlendirilecek personelin numarasını yazın:\n'+names);if(choice===null)return;const idx=Number(choice)-1;if(!Number.isInteger(idx)||idx<0||idx>=staff.length)return alert('Geçerli personel numarası seçin');const p={data:{id:staff[idx].id}};const r=reports.find(x=>x.id===b.dataset.assign);const t=await db.from('tasks').insert({title:r.title,details:r.details,assigned_to:p.data.id,report_id:r.id,created_by:user.id});if(t.error)return alert(t.error.message);update('reports',r.id,{status:'assigned'})});if($('shareInvite'))$('shareInvite').onclick=async()=>{const url='https://eryigityusuf.github.io/yurt-personel-takip/';const message='Yurt Personeli Toplantı ve Görev Takip Sistemi kayıt bağlantısı: '+url+'\nE-posta ve kendi şifrenizle hesap oluşturun.';if(navigator.share){try{await navigator.share({title:'Personel Daveti',text:message});return}catch(e){}}if(navigator.clipboard){try{await navigator.clipboard.writeText(message);alert('Kayıt bağlantısı kopyalandı');return}catch(e){}}prompt('Personelle paylaşılacak bağlantı:',message)};if($('printAgenda'))$('printAgenda').onclick=()=>{$('print').innerHTML='<h1>TOPLANTI GÜNDEM MADDELERİ</h1><p>Tarih: ........... Personel: ................</p>'+agenda.filter(a=>a.status==='approved').map((a,i)=>'<section><b>'+(i+1)+'. '+esc(a.title)+'</b><div class="line"></div><div class="line"></div></section>').join('');window.print()}}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$('login').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return alert('E-posta adresinizi ve şifrenizi girin.');const r=await db.auth.signInWithPassword({email,password});if(r.error)alert(r.error.message);else init()};$('signup').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return alert('Geçerli bir e-posta adresi girin.');if(password.length<8)return alert('Şifreniz en az 8 karakter olmalıdır.');const r=await db.auth.signUp({email,password,options:{emailRedirectTo:'https://eryigityusuf.github.io/yurt-personel-takip/'}});if(r.error)return alert('Hesap oluşturulamadı: '+r.error.message);alert(r.data.session?'Hesabınız oluşturuldu ve giriş yapıldı.':'Hesabınız oluşturuldu. E-posta adresinize gelen doğrulama bağlantısını açın.');if(r.data.session)await init()};$('logout').onclick=async()=>{await db.auth.signOut();user=null;init()};init();</script></body></html>
